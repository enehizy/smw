# Sveltia CMS configuration — https://github.com/sveltia/sveltia-cms
# Each saved entry is committed to the repo as one JSON file; the host rebuilds the site on push.

backend:
  name: github
  repo: enehizy/smw
  branch: main
  # GitHub sign-in for editors needs the free Sveltia auth worker on Cloudflare:
  # https://github.com/sveltia/sveltia-cms-auth — deploy it, then uncomment and set its URL:
  # base_url: https://sveltia-cms-auth.YOUR-SUBDOMAIN.workers.dev

# Uploaded images are committed here and served from /images/uploads/...
media_folder: static/images/uploads
public_folder: /images/uploads

collections:
  - name: news
    label: News & Updates
    label_singular: Article
    folder: src/content/news
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    summary: '{{date}} — {{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: summary
        label: Summary
        widget: text
        hint: One or two sentences shown on the news cards.
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
      - name: image
        label: Thumbnail image
        widget: image
        required: false
        hint: Square images work best. Leave empty to use the SMW logo.
      - { name: body, label: Article, widget: markdown }

  - name: releases
    label: Music
    label_singular: Release
    folder: src/content/releases
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    summary: '{{date}} — {{title}} ({{artists}})'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - name: artists
        label: Artist(s)
        widget: string
        hint: e.g. Big Slesh ft. Kiiwii
      - name: cover
        label: Cover art
        widget: image
        hint: Square artwork, at least 600 × 600.
      - name: date
        label: Release date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        hint: Newest releases appear first; the home page shows the latest four.
      - name: link
        label: Listen link
        widget: string
        required: false
        hint: >-
          One link for the release — a smart link (lnk.to, vyd.co…) or a YouTube link.
          Clicking the release opens it. Tracking bits like utm_ and fbclid are removed automatically.
      - name: links
        label: Individual platform links
        widget: object
        collapsed: true
        hint: >-
          Optional. If any are filled in, clicking the release shows a "Listen on" list
          (with the listen link above as "All platforms").
        fields:
          - { name: spotify, label: Spotify, widget: string, required: false }
          - { name: apple, label: Apple Music, widget: string, required: false }
          - { name: audiomack, label: Audiomack, widget: string, required: false }
          - { name: boomplay, label: Boomplay, widget: string, required: false }
          - { name: youtube, label: YouTube Music, widget: string, required: false }

  - name: videos
    label: Videos
    label_singular: Video
    folder: src/content/videos
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    summary: '{{date}} — {{title}}'
    sortable_fields: [date, title]
    fields:
      - { name: title, label: Title, widget: string }
      - { name: artists, label: Artist(s), widget: string }
      - name: youtube
        label: YouTube link
        widget: string
        hint: Paste the video's YouTube link. The thumbnail is fetched automatically.
        pattern:
          - '(youtube\.com/(watch\?.*v=|shorts/|embed/|live/)|youtu\.be/)[\w-]{11}'
          - Please paste a YouTube video link.
      - name: date
        label: Date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        hint: Newest videos appear first.

  - name: team
    label: Team
    label_singular: Team member
    folder: src/content/team
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{order}}. {{name}} — {{role}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - name: role
        label: Role
        widget: string
        hint: e.g. Founder/CEO, A&R Manager
      - name: photo
        label: Photo
        widget: image
        hint: A portrait photo; it is cropped to fill the tile.
      - name: order
        label: Order
        widget: number
        value_type: int
        min: 1
        default: 10
        hint: Lower numbers appear first. The person with the lowest number (e.g. the founder) is shown large.

  - name: artists
    label: Artists
    label_singular: Artist
    folder: src/content/artists
    extension: json
    format: json
    create: true
    slug: '{{slug}}'
    identifier_field: name
    summary: '{{order}}. {{name}}'
    sortable_fields: [order, name]
    fields:
      - { name: name, label: Name, widget: string }
      - name: order
        label: Order
        widget: number
        value_type: int
        min: 1
        default: 10
        hint: Lower numbers appear first on the Artists page and in the home page slider.
      - name: portrait
        label: Portrait photo
        widget: image
        hint: Tall photo for the Artists page (about 500 × 760).
      - name: banner
        label: Home page photo
        widget: image
        required: false
        hint: Wide photo for the home page slider. Leave empty to use the portrait.
      - name: socials
        label: Social links
        widget: object
        hint: Paste the full profile link for each platform. Empty ones are hidden.
        fields:
          - { name: instagram, label: Instagram, widget: string, required: false }
          - { name: facebook, label: Facebook, widget: string, required: false }
          - { name: youtube, label: YouTube, widget: string, required: false }
          - { name: tiktok, label: TikTok, widget: string, required: false }
          - { name: x, label: X (Twitter), widget: string, required: false }
      - { name: bio, label: Biography, widget: markdown }
